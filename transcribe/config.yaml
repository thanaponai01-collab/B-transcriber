# Engine choices — determined by eval harness bootstrapping
# Engine A: Thai specialist (Thonburian Whisper lineage)
# Engine B: multilingual generalist (Whisper large-v3) — the code-switch slot.
#           Real second hypothesis ⇒ cross-engine agreement is a live confidence
#           signal. It's off (passthrough) because every candidate tried so far
#           has been rejected:
#
#           funasr (SenseVoiceSmall) — RETRACTED, not just rejected. Its own
#           model card documents exactly five supported languages (zh/en/yue/
#           ja/ko) — Thai isn't one. With language="auto" it misdetects Thai
#           speech as Cantonese and decodes Chinese-script garbage throughout
#           (confirmed 2026-07-16 by inspecting raw output: an explicit <|yue|>
#           tag and CJK Unified Ideograph codepoints, not Thai script). The
#           2026-07-15/16 "WER_latin regressed / BER improved" numbers earlier
#           recorded here were measuring that garbage, not a real accuracy
#           tradeoff — DO NOT cite them as evidence about decorrelated engines
#           in general. See engines/funasr.py's docstring and TODO_LEDGER.md.
#           Not re-testable without a different underlying model.
#
#           typhoon_rt (2026-07-16) — TRIED and rejected on genuine accuracy
#           grounds: CER_thai regressed 0.1601 vs 0.1451 baseline, WER_latin
#           regressed 1.1290 vs 1.0452, BER only marginally better (0.8537 vs
#           0.8592). (Its first run crashed on CUDNN_STATUS_SUBLIBRARY_VERSION_
#           MISMATCH — a real, separate bug in faster_whisper.py's PATH
#           mutation leaking into any same-process NeMo engine, since fixed;
#           see TODO_LEDGER.) Don't re-try without new evidence.
#
#           whisper_multi (Whisper large-v3) — genuinely Thai-capable (~100
#           languages incl. Thai), architecturally the right decorrelated
#           candidate — but REJECTED on this probe too: CER_thai regressed
#           0.2323 vs 0.1451 (~60% relative), WER_latin regressed 1.0903 vs
#           1.0452, BER unchanged (0.8616 vs 0.8592). Root cause (diagnosed,
#           not a mystery): on every real A/B disagreement instrumented (11/11
#           on a sample clip), BOTH the LLM reconciler and _script_fallback
#           picked Engine A — the LLM shows a suspicious 100% positional bias
#           under the current (stale, pre-phrase-cue) prompt, and
#           _script_fallback degrades to pure same-script routing because
#           whisper_multi correctly reports confidence=None (never faked) so
#           its confidence-tiebreak never fires. Engine B's only route into
#           the output is un-reconciled solo tokens, which dilute rather than
#           correct. See TODO_LEDGER for the full diagnosis and next steps
#           (prompt fix, position-randomization test, fallback tiebreak).
#           NOT evidence the architecture can't work — evidence the current
#           prompt/model/fallback combination doesn't yet make it work.
#
#           qwen3_asr (Qwen3-ASR-1.7B, LLM-decoder ASR) — 2026-08-05: an
#           initial probe was a false negative (adapter bug: one whole-clip
#           token at a placeholder 0,0ms timestamp couldn't align against
#           Engine A's real per-cue timestamps in align_hyp.py, so B was a
#           silent no-op — see engines/qwen3_asr.py's docstring). Fixed via
#           internal VAD chunking (real per-span timestamps,
#           timestamps_final=True). Re-probed: CER_thai unchanged (0.1415,
#           no dilution), BER improved (0.8169→0.8056), but WER_latin stayed
#           flat (1.0452) — doesn't clear the "BER AND WER_latin both
#           improve" activation bar. NOT a rejection like the three above:
#           zero regression, real (if small) improvement, blocked mainly by
#           the same _script_fallback confidence=None bias diagnosed for
#           whisper_multi. Next lever: fix that tiebreak (§4.3 in
#           HANDOFF_CEILING_BREAK.md), then re-probe. See TODO_LEDGER.md
#           "Qwen3-ASR internal VAD chunking fix" for full numbers.
#
#           qwen3_asr as ENGINE A (HANDOFF_ONE_ENGINE §4 item 4, 2026-08-05):
#           tried as the sole engine on the grown 8-clip corpus, not just
#           Engine B. REJECTED — wer_latin 0.9615, BER 0.8866, cue_BER 0.8237
#           all CONFIRMED regressions (95% CI excludes baseline). cue_BER is
#           the standout failure: cue_count_delta=-187 vs th-medium's +11 —
#           its max_span_s=8.0-capped internal VAD produces far coarser cues
#           than th-medium's phrase-cue granularity, exactly the risk the
#           handoff itself flagged in advance ("this may disqualify it on
#           cue_BER alone, which is itself a valid verdict"). See
#           TODO_LEDGER.md "HANDOFF_ONE_ENGINE Phase B" for the full table.
engine_a: faster_whisper
engine_b: passthrough
engine_batch_size: 4   # chunks per forward pass when an engine supports batched inference;
                        # auto-halves on CUDA OOM (variable-length VAD chunks get padded to
                        # the longest one in a batch, so peak VRAM varies even at fixed batch_size)

# Per-engine construction overrides (2.3), keyed by registry name. run.py forwards
# the matching block as kwargs to the engine constructor — an engine/model/compute
# swap is a YAML edit only. Engines that don't accept a key (passthrough/mock) get
# device only. To swap to Typhoon Turbo CT2 or int8_float16, edit here — no code.
engines:
  faster_whisper:
    # model_id: models/whisper-th-medium-ct2 is the baseline (default, no override needed — the
    # active checkpoint is biodatlab/whisper-th-medium-combined per CLAUDE.md). Engine A large-v3
    # swap probes (HANDOFF_CEILING_BREAK §4/§10.2, 2026-08-04), both REJECTED on the v3 gold set
    # vs baseline eval_run.id=25 (cer_thai 0.1415, BER 0.8169, cue_BER 0.3590):
    #   models/typhoon-whisper-large-v3-ct2 (eval_run.id=26): cer_thai 0.1731, BER 1.0000 (hyp found
    #     0/104 real switch points), cue_BER 0.5926 — worse on every gated signal.
    #   models/pathumma-whisper-th-large-v3-ct2 (eval_run.id=27): cer_thai 0.1464 (within tolerance),
    #     BER 0.8615, cue_BER 0.5741 — BER/cue_BER regressed past gate, REGRESSION verdict, passed=False.
    # Also tried models/typhoon-whisper-turbo-ct2
    # (2026-07 gold-set eval): CER_thai 0.1336 vs 0.1069 for th-medium — turbo lost, reverted.
    # RE-PROBED on the grown 8-clip corpus + CI-aware gate (HANDOFF_ONE_ENGINE §4, 2026-08-05)
    # vs baseline eval_run.id=47 (cer_thai 0.1751, wer_latin 0.8291, BER 0.5324, cue_BER 0.3904).
    # Verdict UNCHANGED — th-medium still wins on every gated signal, now with real 95% CIs:
    #   typhoon (id=48): BER 0.8792, cue_BER 0.6462 — CONFIRMED regressions (CI excludes baseline).
    #     cer_thai 0.2468, wer_latin 0.9530 — regressed but CI-unresolved (baseline still in band).
    #   pathumma (id=49): cue_BER 0.6245 — CONFIRMED regression. cer_thai/wer_latin/BER all
    #     regressed but CI-unresolved. passed=False.
    # Full table (all 4 candidates × all gated metrics × CI): TODO_LEDGER.md
    # "HANDOFF_ONE_ENGINE Phase B" (2026-08-05). Named Phase C fine-tune base checkpoint: this one.
    compute_type: float16                        # int8_float16 frees 8GB headroom for larger batch_size
    beam_size: 5
    cue_gap_ms: 700
    cue_max_ms: 4000
    cue_target_chars: 42   # cue closes once it holds this many chars (subtitle-line
                           # sizing, same family as cue_gap_ms/cue_max_ms — see
                           # _group_words_into_cues; STYLE_GUIDE line-break policy)
    # A space Whisper emitted inside Thai marks a breath/clause boundary, so it is
    # a cue-break candidate — but only once the cue can stand alone as a subtitle,
    # else "โอเค โอเค" shatters into one-word cues. Both minima must be met, and
    # STYLE_GUIDE §7 unsplittable units (mai yamok, numeral+classifier) veto the
    # break regardless. Measured F1-neutral in isolation on a 46s hand-recut
    # reference — the greedy cue_target_chars fill just relocates the arbitrary
    # boundary. These are principled floors, not tuned values; the real win needs
    # the greedy fill replaced by a cost-minimising split.
    cue_space_min_chars: 12
    cue_space_min_ms: 700
    # HANDOFF_CEILING_BREAK §5/§10.3: "dp" replaces the greedy fill above with
    # a cost-minimising subtitle line-break split (candidate breaks = every
    # pythainlp word boundary, not just Whisper's sporadic spaces; STYLE_GUIDE
    # §7 vetoes excluded outright; sentence/gap boundaries still hard splits).
    # Kept behind this flag for one release per the handoff's A/B discipline —
    # see TODO_LEDGER.md "DP cue split probe" for the harness verdict before
    # changing this default.
    cue_split_algorithm: greedy   # greedy (default, unchanged) | dp -- probed 2026-08-04,
                                  # NOT activated: cue_BER 0.3865 vs 0.3590 baseline (regression).
                                  # See TODO_LEDGER.md "DP cue split probe" for full numbers.
    bias_prompt_budget: 200
    batch_size: 8                                # BatchedInferencePipeline parallel batch (3.1);
                                                 # auto-halves on CUDA OOM. Raise with int8_float16 headroom.
    # This engine is whole-file (prefers_whole_file=True), so ingest.py's VAD never
    # touches this audio — these mirror the top-level ingest.vad_threshold /
    # vad_min_silence_ms values and feed the engine's own VAD pass (run in
    # _transcribe_batched via _vad_speech_spans) instead of faster-whisper's
    # defaults (threshold=0.5, min_silence_duration_ms=2000), which were clipping
    # soft trailing speech and Thai sentence-final particles (ครับ/ค่ะ). Speech runs
    # longer than ~25s with no pause near that boundary (faster-whisper's own
    # aggressive-split point) are chopped into overlapping windows and stitched
    # instead of cut arbitrarily mid-utterance — see _LONG_SPAN_SAFE_S.
    vad_threshold: 0.35
    vad_min_silence_ms: 500
  # Engine B candidate — not active (engine_b: passthrough above). LLM-decoder
  # ASR, the code-switch-wall priority candidate per HANDOFF_CEILING_BREAK.md
  # §6/4.1. Requires `qwen-asr` (see requirements.txt, commented out) — install
  # before setting engine_b: qwen3_asr and probing with --experiment.
  qwen3_asr:
    model_id: Qwen/Qwen3-ASR-1.7B
    max_inference_batch_size: 8
    max_new_tokens: 256
    # 2026-08-xx: capped well under faster_whisper's 25s _LONG_SPAN_SAFE_S —
    # a real-disagreement instrumentation pass found every _script_fallback
    # disagreement was Engine A's ~2-5s phrase cue vs one Qwen3-ASR token
    # spanning up to 25s of multi-sentence speech, never a comparable
    # head-to-head. See engines/qwen3_asr.py's _speech_spans_s docstring and
    # TODO_LEDGER.md "Qwen3-ASR span-granularity fix".
    max_span_s: 8.0

# HANDOFF_ONE_ENGINE.md §6 (Phase D) — N-best self-ensemble: pseudo-Engine-B is
# a SECOND decode pass through Engine A's own already-loaded residency instead
# of a real second model. Off by default — when enabled, run.py never
# instantiates or loads engine_b at all (see pipeline/run.py's
# self_ensemble_enabled branch); engine_b's config.yaml value only labels the
# job/eval_run row. Requires a whole-file Engine A (prefers_whole_file=True,
# i.e. faster_whisper) — raises otherwise. Probe with
# `python -m transcribe.eval.harness --self-ensemble --experiment` (never
# activate by editing this block directly without a harness run backing it).
#
# PROBED 2026-08-05 (ladder step (a), "same params, temperature 0 vs 0.2"):
# temperature ALONE is architecturally a no-op through
# BatchedInferencePipeline — beam search (beam_size>1) is deterministic and
# CTranslate2's sampling_temperature has no effect on it (verified against
# faster-whisper 1.2.1 source, and confirmed empirically: byte-identical
# hypotheses at temperature 0.0 through 1.0 on a real gold clip, and the full
# 8-clip harness run reproduced eval_run.id=47 to the last decimal — zero
# reconciler disagreements, zero possible metric movement). See
# faster_whisper.py's _transcribe_batched docstring and TODO_LEDGER.md
# "HANDOFF_ONE_ENGINE Phase D" for the full diagnosis.
#
# Adapted probe (still Phase D, same residency, zero second load):
# beam_size_b=1 switches CTranslate2 into greedy decode for hypothesis B —
# genuinely different content from the beam-5 hypothesis A (confirmed on the
# same clip: real text differences, not just re-timed cues). temperature_b is
# harmless but inert at beam_size=1 too (CTranslate2's sampling_topk defaults
# to 1 there, i.e. still deterministic argmax) — kept as a documented no-op
# rather than removed, in case a future faster-whisper version threads
# sampling_topk through and makes it live.
self_ensemble:
  enabled: false
  temperature_a: 0.0   # hypothesis 1 — production beam-5 decode, unchanged
  beam_size_a: null     # null -> engines.faster_whisper.beam_size (production, 5)
  temperature_b: 0.2   # documented no-op at beam_size_b=1 — see comment above
  beam_size_b: 1        # hypothesis 2 — greedy decode, same residency

# Ingestion
denoise: true
vad_threshold: 0.35        # Thai sentence-final particles (ครับ/ค่ะ) get cut at 0.5
vad_min_speech_ms: 250
vad_min_silence_ms: 500    # wider silence window keeps soft particles intact
# RMS silence gate (2026-08-03): a second, energy-only pass that sub-splits a VAD
# "speech" span wherever raw loudness drops below a floor for at least
# rms_gate_min_gap_ms — independent of vad_threshold. Fixes multi-second "speech"
# spans that are audibly mostly dead air (VAD's probability model calls quiet room
# tone speech at threshold 0.35) without reintroducing the Thai-particle-clipping
# regression that raising vad_threshold caused. See ingest._rms_gate_segments.
rms_gate_enabled: true
# floor_db: null means auto-estimate per file from its own quietest speech content
# (see ingest._estimate_speech_floor_db) — a fixed dB number is calibrated to one
# recording's gain staging and won't generalize across different mics/rooms/shoots.
# Set a float here only to pin/override the estimate for a specific source.
rms_gate_floor_db: null
rms_gate_floor_percentile: 10.0   # how far into the quiet tail counts as "gate-able"
rms_gate_min_gap_ms: 300
chunk_overlap_ms: 750       # GAP-4: adjacent VAD chunks overlap this much so stitch.py
                            # dedupes seam words (only used when a chunk engine is active)
conform_vfr: false          # GAP-2: transcode a CFR proxy for VFR sources before frame export

# Hallucination filtering (GAP-3): drop tokens that sit mostly inside VAD silence
drop_tokens_over_silence: true
silence_overlap: 0.8        # fraction of a token's span inside silence to drop it
# Ingest's Silero VAD and a whole-file engine's own internal VAD are different
# implementations and can disagree; only drop a silence-overlapping token when
# its own confidence is also <= this (or unknown) -- otherwise the engine
# genuinely heard and transcribed real speech there. Set null to restore the
# old overlap-only behavior.
silence_drop_max_confidence: 0.5

# Subtitle cue timing (Phase 7b, align_force.conform_cues) — enforced on EVERY
# path, including the timestamps_final one that skips forced alignment. Cues are
# always de-overlapped and clamped; this only tunes gap closing. A gap this short
# is timestamp noise, not a pause, and it makes burned-in subtitles flicker off
# and back on — hand-cut reference SRTs are gapless. 0 disables gap closing.
cue_max_close_gap_ms: 200

# Evaluation
boundary_tol_ms: 300   # switch-point match tolerance (see eval/README.md)

# Normalization — explicit policy, see STYLE_GUIDE.md. Applied identically to
# hypotheses and to the gold set during eval.
normalization:
  thai_digits: true        # map Thai numerals ๐-๙ → Arabic 0-9
  mai_yamok_attach: true   # canonicalize 'word ๆ' / 'wordๆๆ' → 'wordๆ' (no expansion —
                            # deliberate divergence from Na-Thalang/Typhoon, see STYLE_GUIDE.md §3)
  exception_lexicon:
    - COVID-19
    - iPhone
    - iPad
    - YouTube
    - LINE OA        # before LINE: longest-first protection needs the longer form listed too
    - LINE
    - TikTok
    - Facebook
    - Instagram
    - ChatGPT
    - GPT-4
    - AI
    - API
    # Thai e-commerce / daily-life brands that show up constantly in creator speech
    - Shopee
    - Lazada
    - Grab
    - Netflix
    - Google
    - Zoom
    - WiFi
    - Premiere Pro

# Cue break-atom lexicon (HANDOFF_THAI_BREAK_ATOMS.md, STYLE_GUIDE §7) — grows
# the four seeded rules (mai yamok, reciprocal particle กัน, numeral+unit,
# classifier+demonstrative) from observed Premiere-recut pain without a code
# change. unsplittable_terms is NOT set here — it's the exception_lexicon
# above, one list, not two to keep in sync.
thai_atoms:
  extra_bind_left: []      # extra tokens that glue to the atom before them
  extra_pairs: []           # extra [classifier, demonstrative] pairs, e.g. [เรื่อง, นี้]
  disable: []               # rule names to turn off: mai_yamok, reciprocal_particle,
                             # numeral_unit, classifier_demonstrative, final_particle
  pos_condition_reciprocal: false
    # HANDOFF_THAI_BREAK_ATOMS.md §6 Phase 4 probe. Default (false): กัน glues
    # to whatever precedes it unconditionally (bind_left, §2.4's "over-gluing
    # is the safe failure direction"). true: กัน only glues after a token
    # pythainlp.tag.pos_tag (perceptron, ORCHID tagset) tags as a verb — กัน
    # is also "to block" outside the reciprocal sense, and this removes that
    # over-glue at the cost of a per-file CPU POS-tagging pass.
    # PROBED 2026-08-06 (explicit override of the handoff's own evidence gate
    # — neither §6 trigger had fired). Harness --experiment vs production
    # baseline eval_run.id=57: byte-identical on all four gated metrics
    # (cer_thai/wer_latin/BER/cue_BER) and rtf (0.198 vs 0.196, within noise).
    # NOT evidence of correctness OR of no benefit: the 8-clip gold set
    # contains zero occurrences of กัน at all (reference transcripts checked
    # directly), so this flag was never exercised by the run. Stays false —
    # unproven, not disproven. See TODO_LEDGER for the full record and what
    # would actually test it (a fixture clip with a non-reciprocal กัน).

# Eval regression gate: reject if a metric worsens by more than this fraction,
# OR by more than regression_abs_floor in absolute terms — whichever band is
# wider. The absolute floor keeps a near-zero baseline from tripping on any
# nonzero score (relative-only collapses to 0 when the baseline is 0).
regression_tolerance: 0.02
regression_abs_floor: 0.005

# Flywheel
flywheel:
  min_occurrences: 3       # corrections needed before a term enters the bias index
  stale_engine_weight: 0.2 # weight for corrections from engines no longer active
  bias_prompt_budget: 200  # GAP-5: max tokens packed into an engine's initial_prompt

# CutDeck rough-cut system (Part B) — config consumed by the cutdeck/ package.
# Present now so Phase 0 (timebase + VAD persistence) has a home; the deterministic
# rules pass turns on after the first eval baseline.
cut:
  min_silence_ms: 250       # VAD silence longer than this becomes a cut (tightened 2026-08-03: was 350)
  pad_pre_ms: 50            # kept pre-roll before speech (attack matters most; tightened 2026-08-03: was 80)
  pad_post_ms: 25           # kept post-roll after speech (tightened 2026-08-03: was 40)
  min_clip_ms: 1200         # kept clips shorter than this merge into a neighbor
  max_dissolve_ms: 4000     # cap on dead air a merge may re-admit; longer cuts
                             # get their too-short neighbor dropped instead (bug
                             # fix 2026-08-03: a stray sub-min_clip_ms blip between
                             # two long silences was stitching them back together)
  fillers_enabled: false    # turn on after first eval baseline
  filler_lexicon: [เอ่อ, อ่า, อืม, เอิ่ม, um, uh]
  filler_lexicon_contextual: [แบบ, แบบว่า, ก็คือ, คือว่า, like, you know]
  retake_markers: [เดี๋ยวเอาใหม่, เอาใหม่นะ, ตัดตรงนี้, อันนี้ผิด, เมื่อกี้พูดผิด]
  llm_enabled: false       # HANDOFF_CUTDECK_WORDLEVEL.md Phase 6 (cutdeck/takes.py)
                             # gates the retake/false-start LLM classifier; the
                             # deterministic marker pre-pass runs regardless. Off
                             # until an eval baseline exists, same discipline as
                             # every other new cut behaviour above (was
                             # unconsumed dead config before Phase 6 wired it up).
  keep_last_take: true
  retake_window_segments: 5      # 6 — Jaccard-cluster / marker-lookback window width
  repeat_take_jaccard_threshold: 0.55  # 6 — char-Jaccard above this = same take
  false_start_max_ms: 2500        # 6 — false-start candidate must be shorter than this
  repeats_enabled: false    # HANDOFF_CUTDECK_WORDLEVEL.md 2.2 — stutter/duplicate-word removal, off until an eval baseline exists
  repeat_max_ngram: 4
  repeat_max_gap_ms: 600
  word_blade_crossfade_ms: 20   # 2.3 — audio crossfade on mid-speech (word-blade) cuts
  rough_cut_mode: interval  # HANDOFF_CUTDECK_WORDLEVEL.md Phase 4 — interval | segment;
                             # segment builds keeps outward from segments (no min-clip
                             # merge needed) but is unproven on real footage, stays
                             # opt-in until watched via cutdeck/preview.py
  nonspeech_enabled: false  # 5.1 — off until an eval baseline exists, same discipline as fillers/repeats
  min_nonspeech_ms: 400     # token-less "speech"-classified span longer than this
                             # is VAD-misclassified dead air (breath/cough/noise), cut outright
  adaptive_silence: false   # 5.2 — percentile silence threshold, off until an eval baseline exists
  silence_percentile: 60
segment:
  gap_ms: 700               # token gap larger than this starts a new segment
  vad_silence_ms: 500       # VAD silence between tokens that forces a split

# Phase 3 — LLM reconciler tiebreak on A/B disagreements. Local-only: calls a
# model served by `ollama serve`, never an external API. Off by default —
# reconcile._pick() falls back to _script_fallback whenever llm_enabled is
# false, Ollama isn't running, or the model isn't pulled (any exception from
# llm_reconcile.make_llm_fn's callable is caught there). Requires
# `ollama pull <model>` once, and `ollama serve` running locally, before
# enabling.
#
# PROBED 2026-07-16 (Ollama running, qwen2.5:3b-instruct, engine_b=
# whisper_multi so real disagreements existed) in two rounds:
#   Round 1 (stale prompt, fixed ta=slot-0 mapping): LLM picked Engine A on
#   11/11 real disagreements — positional bias, not judgment.
#   Round 2 (llm_reconcile.py fixed: phrase-cue-aware prompt + per-call
#   position randomization, see its module docstring): the degenerate lock-in
#   is confirmed gone (7/11 A, 4/11 B on re-instrumentation) — but corpus
#   CER_thai got WORSE (0.3505 vs round 1's 0.2323 vs 0.1451 baseline). This
#   is the fix correctly exposing a model-quality problem, not a new bug:
#   qwen2.5:3b-instruct's judgment on real disagreements isn't good enough to
#   beat the (accidental, round-1) heuristic of always trusting the stronger
#   engine. The wiring/prompt/bias defects are fixed and should not be
#   revisited; what remains is whether a bigger local model (qwen2.5:7b-
#   instruct?) or a richer prompt (few-shot examples, surrounding context)
#   can do genuinely better than always-trust-Engine-A. See TODO_LEDGER.md.
reconciler:
  llm_enabled: false
  ollama:
    host: http://localhost:11434
    model: qwen2.5:3b-instruct
    timeout_s: 30   # first call after Ollama has unloaded the model can take >10s to reload
