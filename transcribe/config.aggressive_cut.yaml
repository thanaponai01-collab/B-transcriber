# Overlay for cutdeck/xml_recut.py's --overlay flag: tuned, more-aggressive
# silence-removal thresholds vs. transcribe/config.yaml's defaults. Applied
# on top of --config (default transcribe/config.yaml) — only these 7 keys
# change, everything else (engines, normalization, reconciler, ...) still
# comes from the base config.
vad_min_silence_ms: 300
rms_gate_min_gap_ms: 150
cut:
  min_silence_ms: 120
  min_clip_ms: 500
  max_dissolve_ms: 300
  pad_pre_ms: 30
  pad_post_ms: 15
