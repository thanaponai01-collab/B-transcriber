<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CutDeck</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  html, body {
    width: 100%;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 12px;
    color: #eceeed;
    background: #191b1a;
    overflow-y: auto;
    user-select: none;
  }
  body { padding: 10px; }

  /* SVG Base */
  svg {
    display: inline-block;
    vertical-align: middle;
    fill: none;
    flex-shrink: 0;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 8px;
    border-bottom: 1px solid #282d2a;
    border-bottom-style: solid;
  }
  .brand {
    display: flex;
    align-items: center;
    font-weight: 700;
    font-size: 13px;
    color: #e5eae7;
    letter-spacing: -0.2px;
  }
  .status-indicator {
    display: inline-flex;
    align-items: center;
    font-size: 10px;
    color: #7b8681;
    margin-left: 8px;
  }
  .status-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #52b788;
    margin-right: 4px;
  }
  .status-dot.busy { background: #d97706; }
  .status-dot.error { background: #ef4444; }

  .header-actions {
    display: flex;
    align-items: center;
  }
  .header-actions .icon-btn + .icon-btn {
    margin-left: 3px;
  }
  .icon-btn {
    background: transparent;
    border: 0;
    color: #7b8681;
    padding: 5px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .icon-btn:hover {
    background: #282e2b;
  }
  .icon-btn svg {
    width: 14px;
    height: 14px;
    stroke: #7b8681;
  }
  .icon-btn:hover svg {
    stroke: #e5eae7;
  }

  /* Diagnostics Drawer */
  #diagnostics {
    display: none;
    margin-top: 8px;
    padding: 8px;
    background: #141615;
    border: 1px solid #282d2a;
    border-style: solid;
    border-radius: 6px;
  }
  #diagnostics.open { display: block; }
  .diag-title {
    font-size: 9px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #6d7772;
    margin-bottom: 6px;
  }
  .diag-grid {
    display: flex;
    flex-direction: column;
  }
  .diag-grid > .btn-secondary + .btn-secondary {
    margin-top: 5px;
  }

  /* Resume / Dismiss Banner */
  #job-banner {
    display: none;
    margin-top: 8px;
    padding: 8px 10px;
    background: #24241d;
    border: 1px solid #4a4628;
    border-style: solid;
    border-radius: 6px;
  }
  #job-banner.show { display: block; }
  .job-title { font-size: 11px; font-weight: 600; color: #d4c885; margin-bottom: 6px; }
  .job-actions { display: flex; }
  .job-actions > * { flex: 1; }
  .job-actions > * + * { margin-left: 6px; }

  /* Sequence Card */
  .sequence-card {
    margin-top: 8px;
    padding: 7px 9px;
    background: #232725;
    border: 1px solid #333a36;
    border-style: solid;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
  }
  .sequence-card:hover { border-color: #454e48; }
  #sequence {
    font-size: 11px;
    font-weight: 600;
    color: #e5eae7;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
    margin-right: 8px;
  }
  .range-badge {
    flex-shrink: 0;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 11px;
    font-weight: 600;
    color: #b0bab4;
    background: #1a1d1b;
    border: 1px solid #2f3632;
    border-style: solid;
    padding: 2px 6px;
    border-radius: 4px;
  }

  /* Form Fields */
  .control-group {
    margin-top: 8px;
  }
  .control-label {
    display: block;
    font-size: 9px;
    font-weight: 600;
    color: #7b8681;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  select {
    width: 100%;
    padding: 5px 7px;
    background: #181a19;
    border: 1px solid #313834;
    border-style: solid;
    border-radius: 5px;
    color: #d1d8d4;
    font-size: 11px;
    outline: none;
  }

  /* Preset Switcher Pills */
  .pills-grid {
    display: flex;
  }
  .pill-btn {
    flex: 1;
    background: #1c1f1d;
    border: 1px solid #313834;
    border-style: solid;
    border-radius: 5px;
    padding: 6px 8px;
    color: #8c9791;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    text-align: center;
  }
  .pill-btn + .pill-btn {
    margin-left: 5px;
  }
  .pill-btn:hover:not(.active) { border-color: #454e48; color: #c4cdc8; }
  .pill-btn.active {
    background: #2b322e;
    border-color: #4d5852;
    color: #ffffff;
    font-weight: 600;
  }

  /* Actions Area: SYNC FIRST */
  .actions-grid {
    margin-top: 10px;
    display: flex;
    flex-direction: column;
  }
  .actions-grid > .btn-primary + .btn-primary {
    margin-top: 6px;
  }

  /* Native Premiere Pro Style Gray Buttons */
  .btn-primary {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid #434c46;
    border-style: solid;
    border-radius: 5px;
    background: #2c322f;
    color: #e5eae7;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .btn-primary svg {
    width: 14px;
    height: 14px;
    margin-right: 6px;
    stroke: #b0bab4;
  }
  .btn-primary:hover {
    background: #363d39;
    border-color: #556159;
    color: #ffffff;
  }
  .btn-primary:hover svg {
    stroke: #ffffff;
  }
  .btn-primary:active {
    background: #242926;
  }

  /* Secondary Buttons */
  .btn-secondary {
    background: #212523;
    border: 1px solid #313834;
    border-style: solid;
    color: #9ba6a0;
    font-size: 10px;
    font-weight: 500;
    padding: 5px 8px;
    border-radius: 4px;
    cursor: pointer;
    text-align: center;
  }
  .btn-secondary:hover { background: #282e2b; color: #e5eae7; border-color: #434c46; }

  /* Destructive control */
  .btn-secondary.danger { border-color: #633636; color: #d48a8a; }
  .btn-secondary.danger.armed { background: #522222; border-color: #804040; color: #ffffff; font-weight: 600; }

  [disabled="true"], [disabled], .disabled {
    opacity: 0.35;
    pointer-events: none;
  }

  /* Status Bar */
  .status-card {
    margin-top: 10px;
    padding: 6px 8px;
    background: #141615;
    border: 1px solid #242926;
    border-style: solid;
    border-radius: 5px;
    display: flex;
    align-items: flex-start;
    min-height: 28px;
  }
  .status-icon {
    flex-shrink: 0;
    margin-top: 4px;
    margin-right: 7px;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #7b8681;
  }
  #status {
    flex: 1;
    font-size: 10px;
    line-height: 1.4;
    color: #8c9791;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border-width: 0;
  }
</style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="brand">
      CutDeck
      <div class="status-indicator">
        <div id="dot" class="status-dot"></div>
        <span id="state-text">Ready</span>
      </div>
    </div>

    <div class="header-actions">
      <div id="refresh" class="icon-btn" role="button" title="Refresh timeline marks">
        <svg viewBox="0 0 24 24" stroke="#7b8681" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
      </div>
      <div id="tools-toggle" class="icon-btn" role="button" title="Diagnostics">
        <svg viewBox="0 0 24 24" stroke="#7b8681" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="1.5"/>
          <circle cx="12" cy="5" r="1.5"/>
          <circle cx="12" cy="19" r="1.5"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- Diagnostics Drawer (Toggleable) -->
  <div id="diagnostics">
    <div class="diag-title">Diagnostics</div>
    <div class="diag-grid">
      <div id="socketprobe" class="btn-secondary" role="button">Diagnose helper connection</div>
      <div id="copystatus" class="btn-secondary" role="button">Copy status to clipboard</div>
      <div id="timingprobe" class="btn-secondary" role="button">Check Premiere timing (read-only)</div>
      <div id="assembleprobe" class="btn-secondary danger" role="button">Run assemble probe (MUTATES)</div>
    </div>
  </div>

  <!-- Resume / Dismiss Banner (Only shown if unfinished job exists) -->
  <div id="job-banner">
    <div class="job-title">Previous job in progress</div>
    <div class="job-actions">
      <div id="resume" class="btn-secondary" role="button">Resume Job</div>
      <div id="dismiss" class="btn-secondary" role="button">Dismiss</div>
    </div>
  </div>

  <!-- Sequence Card -->
  <div id="seq-card" class="sequence-card" role="button" title="Click to refresh timeline marks">
    <div id="sequence">No sequence open</div>
    <div id="range" class="range-badge">--:--</div>
  </div>

  <!-- Options: Reference Audio & Cut Mode -->
  <div class="control-group">
    <label class="control-label" for="audio">Audio</label>
    <select id="audio">
      <option value="" selected>Auto</option>
    </select>
  </div>

  <div class="control-group">
    <div class="control-label">Cut Mode</div>
    <div class="pills-grid">
      <div id="pill-speech" class="pill-btn active" role="button">Speech + Silence</div>
      <div id="pill-silence" class="pill-btn" role="button">Silence Only</div>
    </div>
    <select id="mode" class="sr-only">
      <option value="protected" selected>protected</option>
      <option value="silence">silence</option>
    </select>
  </div>

  <!-- Actions: SYNC FIRST, ROUGH CUT SECOND -->
  <div class="actions-grid">
    <div id="sync" class="btn-primary" role="button">
      <svg viewBox="0 0 24 24" stroke="#b0bab4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19.5 12c0-1.232-.046-2.453-.138-3.662a4.006 4.006 0 00-3.7-3.7 48.678 48.678 0 00-7.324 0 4.006 4.006 0 00-3.7 3.7c-.017.22-.032.441-.046.662M19.5 12l3-3m-3 3l-3-3m-12 3c0 1.232.046 2.453.138 3.662a4.006 4.006 0 003.7 3.7 48.656 48.656 0 007.324 0 4.006 4.006 0 003.7-3.7c.017-.22.032-.441.046-.662M4.5 12l3 3m-3-3l-3 3"/>
      </svg>
      Sync Multi-Cam
    </div>

    <div id="cut" class="btn-primary" role="button">
      <svg viewBox="0 0 24 24" stroke="#b0bab4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="6" cy="6" r="3"/>
        <circle cx="6" cy="18" r="3"/>
        <line x1="20" y1="4" x2="8.12" y2="15.88"/>
        <line x1="14.47" y1="14.48" x2="20" y2="20"/>
        <line x1="8.12" y1="8.12" x2="12" y2="12"/>
      </svg>
      Rough Cut
    </div>
  </div>

  <!-- Status Bar -->
  <div class="status-card">
    <div id="status-icon" class="status-icon"></div>
    <div id="status" role="status">No sequence open</div>
  </div>

  <script src="main.js"></script>
</body>
</html>
